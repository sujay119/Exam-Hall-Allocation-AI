kind = "api"
previewPath = "/api"
title = "ExamAI Python API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["python", "-m", "compileall", "-q", "artifacts/api-server"]

[services.production.run]
args = ["python", "artifacts/api-server/run.py"]

[services.production.run.env]
PORT = "8080"
FLASK_DEBUG = "0"

[services.production.health.startup]
path = "/api/healthz"
